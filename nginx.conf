user root;
worker_processes 1;

events {}

http {
  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      proxy_pass http://frontend_angular:4200/;
    }

    location / {
      try_files $uri $uri/ /index.html =404;
    }
  }
}